<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مدينة مهندس في دقيقة</title>
<meta name="description" content="مدينة 3D لمتابعي مهندس في دقيقة — كل متابع ليه دور باسمه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1024;--panel:#141b38;--panel2:#1c2550;--line:#2c376d;--txt:#eef2ff;--mut:#9aa6d6;--acc:#ffc93c;--acc2:#ff8a2a;--ok:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.demo{position:fixed;top:0;left:0;right:0;z-index:30;background:linear-gradient(90deg,#ff8a2a,#ffc93c);color:#2a1700;font-weight:700;font-size:13px;text-align:center;padding:5px 10px}
.top{position:fixed;top:34px;left:12px;right:12px;z-index:20;display:flex;gap:8px;align-items:center}
.brand{background:rgba(20,27,56,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:16px;font-weight:900}
.brand span{font-size:12px;color:var(--acc)}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:14px;background:rgba(20,27,56,.85);backdrop-filter:blur(8px);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.ib.hot{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0}
.search{position:fixed;top:92px;left:12px;right:12px;z-index:21;display:none;gap:8px}
.search.on{display:flex}
.search input{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:#0f1530;color:var(--txt);font-family:inherit;font-size:16px;padding:0 14px;direction:ltr;text-align:right}
.search .go{height:46px;padding:0 18px;border-radius:14px;background:var(--acc);color:#2a1700;font-weight:700}
.sugg{position:fixed;top:144px;left:12px;right:12px;z-index:21;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:40vh;overflow:auto;display:none}
.sugg div{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}
.sugg div:hover{background:var(--panel2)}
.sugg small{color:var(--acc)}
.bottom{position:fixed;bottom:14px;left:12px;right:12px;z-index:20;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(20,27,56,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
.pill.acc{background:var(--acc);color:#2a1700;border:0}
.hint{position:fixed;bottom:64px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut);z-index:19;pointer-events:none}
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px 24px;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:22px;border:1px solid var(--line);max-height:calc(100vh - 120px)}}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-h h3{font-size:19px;font-weight:900;flex:1}
.x{width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.fl{display:flex;align-items:center;gap:12px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;flex:none}
.un{font-size:18px;font-weight:700;direction:ltr;text-align:right}
.meta{font-size:13px;color:var(--mut)}
.badge{display:inline-block;background:#2a3570;border-radius:999px;padding:2px 10px;font-size:12px;margin:6px 0 0 4px}
.badge.g{background:var(--acc);color:#2a1700;font-weight:700}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#2a1700}
.free{background:#0f2a22;border:1px solid #1f5a45;border-radius:14px;padding:12px;font-size:14px;margin-bottom:10px}
.free b{color:var(--ok)}
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow:auto}
.tab{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:600}
.tab.on{background:var(--acc);color:#2a1700;border:0}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:118px}
.it .e{font-size:26px}
.it b{font-size:14px}
.it small{font-size:12px;color:var(--mut);flex:1}
.it .pr{font-weight:900;color:var(--acc);font-size:16px}
.it.sold{opacity:.5;pointer-events:none}
.it.sold .pr{color:var(--mut)}
.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;background:linear-gradient(135deg,#3a2a08,#2a1a40);border-color:#6b5420}
.big .e{font-size:34px}
.lb li{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.lb .n{width:42px;text-align:center;font-weight:900;color:var(--acc)}
.lb .u{flex:1;direction:ltr;text-align:right;font-weight:600}
.note{font-size:12px;color:var(--mut);margin:8px 0}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center}
.mbox .e{font-size:44px}
.mbox h4{font-size:19px;margin:6px 0}
.mbox p{font-size:14px;color:var(--mut);margin-bottom:6px}
.warn{background:#3a2208;border:1px solid #7a4a10;color:#ffd79a;border-radius:12px;padding:8px;font-size:13px;margin:10px 0}
.toast{position:fixed;top:96px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:70;background:var(--ok);color:#03241a;font-weight:700;padding:10px 18px;border-radius:999px;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.load{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .5s}
.load b{font-size:26px;font-weight:900}
.load p{color:var(--mut)}
</style>
</head>

const COLORS = ['#e8505b','#f9a03f','#3ddc97','#4aa3ff','#a66cff','#ff6fb5','#18c4c4','#8bc34a'];
const colorOf = u => COLORS[[...u].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const letterOf = u => (u.replace(/[^\p{L}\p{N}]/gu,'')[0] || '?').toUpperCase();
function towerAtlas(k) {
  const PH = 64, W = 512, c = document.createElement('canvas'); c.width = W; c.height = PH*100;
  const g = c.getContext('2d');
  for (let i = 0; i < 100; i++) {
    const n = k*100 + i + 1, u = MAP.get(n), y = (99-i)*PH;
    const owned = S.owned[n] || {};
    g.fillStyle = u ? (owned.max ? '#3a2a08' : '#0d1838') : '#0a0f22'; g.fillRect(0, y, W, PH);
    if (!u) { g.fillStyle = '#141c3a'; for (let w = 0; w < 6; w++) g.fillRect(20 + w*82, y+14, 60, PH-28); continue; }
    g.fillStyle = owned.neon ? '#ff3fa4' : (n % 100 === 0 || n >= 300 && k > 2 ? '#ffc93c' : '#1c2a5c');
    g.beginPath(); g.roundRect(10, y+6, W-20, PH-12, 16); g.fill();
    g.fillStyle = '#ffc93c'; g.beginPath(); g.roundRect(18, y+12, 92, PH-24, 12); g.fill();
    g.fillStyle = '#10203f'; g.font = '900 30px Cairo, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(AR(n), 64, y+PH/2+2);
    g.fillStyle = colorOf(u); g.beginPath(); g.arc(140, y+PH/2, 20, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '700 22px Cairo, Arial, sans-serif'; g.fillText(letterOf(u), 140, y+PH/2+1);
    g.fillStyle = (n % 100 === 0 || k > 2) && !owned.neon ? '#2a1700' : '#fff'; g.font = '700 28px Cairo, Arial, sans-serif'; g.textAlign = 'left';
    g.fillText(u.length > 20 ? u.slice(0,19)+'…' : u, 172, y+PH/2+2);
    if (owned.max) { g.fillStyle = '#ffc93c'; g.font = '28px sans-serif'; g.textAlign = 'right'; g.fillText('👑', W-22, y+PH/2+2); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

const towers = [];

  // skeleton above (under construction)
  if (top < 100) {
    const sk = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color: 0x3a4a8a });

    grp.add(sk); grp.userData.crane = jib;

    const crown = new THREE.Mesh(new THREE.CylinderGeometry(TW*.3, TW*.55, 12, 4), new THREE.MeshStandardMaterial({ color: 0xffc93c, emissive: 0x664400 }));

  }

  const lc = document.createElement('canvas'); lc.width = 512; lc.height = 160; const lg = lc.getContext('2d');
  lg.fillStyle = 'rgba(12,18,45,.85)'; lg.beginPath(); lg.roundRect(6, 6, 500, 148, 36); lg.fill();
  lg.strokeStyle = '#ffc93c'; lg.lineWidth = 6; lg.stroke();
  lg.fillStyle = '#ffc93c'; lg.font = '900 64px Cairo, Arial, sans-serif'; lg.textAlign = 'center'; lg.textBaseline = 'middle';
  lg.fillText('البرج ' + AR(k+1), 256, 62);
  const cnt = FLOORS.filter(([n]) => tw(n) === k).length;
  lg.fillStyle = '#fff'; lg.font = '700 40px Cairo, Arial, sans-serif'; lg.fillText(cnt >= 100 ? 'اكتمل ✓' : AR(cnt) + ' دور', 256, 120);
  const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), depthTest: false }));
  lab.scale.set(30, 9.4, 1); lab.position.y = (top < 100 ? H + Math.min(30, 100-top)*FH : H + 12) + 12; grp.add(lab);
  scene.add(grp);
  towers[k] = { grp, body, H, top, face };

    const t = new THREE.Mesh(new THREE.CylinderGeometry(.42*s - i*.02, .5*s - i*.02, h/segs, 7), trunkM);
    t.position.set(Math.sin(i*.3)*.25, h/segs*(i+.5), 0); t.rotation.z = Math.sin(i*.3)*.04; g.add(t);
  }

  for (let i = 0; i < 9; i++) {
    const shape = new THREE.Shape(); shape.moveTo(0,0); shape.quadraticCurveTo(2.2*s, .9*s, 5*s, 0); shape.quadraticCurveTo(2.2*s, -.5*s, 0, 0);
    const leaf = new THREE.Mesh(new THREE.ShapeGeometry(shape, 6), leafM);
    leaf.position.set(.6, h, 0); leaf.rotation.set(0, i/9*Math.PI*2, -.45 - (i%2)*.2); g.add(leaf);
  }
  const dates = new THREE.Mesh(new THREE.SphereGeometry(.5*s, 8, 6), new THREE.MeshStandardMaterial({ color: 0xc8781e })); dates.position.set(.6, h - .6, 0); g.add(dates);
  return g;
}

// day/night follows Riyadh time (UTC+3): night 19:00-05:00, dawn 05-07, dusk 17-19
function riyadhNight() {
  const d = new Date(), h = ((d.getUTCHours() + 3) % 24) + d.getUTCMinutes()/60;
  if (h >= 7 && h < 17) return 0; if (h >= 19 || h < 5) return 1;
  return h < 12 ? 1 - (h - 5)/2 : (h - 17)/2;
}
let manual = null;
const cN = new THREE.Color(0x0b1024), cD = new THREE.Color(0xbcd0f0), gN = new THREE.Color(0x141a30), gD = new THREE.Color(0x8a8f9a);
function applyNight(n) {
  night = n > .5; sky.material.uniforms.n.value = n;
  hemi.intensity = 1.3 - .7*n; sun.intensity = 2.2 - 1.7*n;
  scene.fog.color.copy(cD).lerp(cN, n); ground.material.color.copy(gD).lerp(gN, n);
  window.__wl.visible = n > .35; $('bNight').textContent = night ? '☾' : '☀';
  towers.forEach(t => t && (t.face.emissiveIntensity = .25 + .6*n));
  GARDEN.lamps.forEach(l => l.visible = n > .35);
}
function tickNight() { applyNight(manual ?? riyadhNight()); }
setInterval(tickNight, 60000);

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
let down = null;
cv.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; touring = false; $('bTour').textContent = 'جولة في المدينة'; });
cv.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  mv.set(e.clientX/innerWidth*2-1, -e.clientY/innerHeight*2+1); ray.setFromCamera(mv, cam);
  const hit = ray.intersectObjects([...towers.map(t => t.body), ...STREETS.map(s => s.sign), ...GARDEN.palms, ...GARDEN.signs, ...BOARDS.map(b => b.hit), ...STAD.hit])[0];
  if (!hit) return;
  if (hit.object.userData.gardenSign) { flyGarden(hit.object.userData.gardenSign - 1); showGarden(); return; }
  if (hit.object.userData.board) { showBoard(hit.object.userData.board); return; }
  if (hit.object.userData.stadium) { flyStadium(); showStadium(); return; }
  if (hit.object.userData.palm) { const [n,u] = hit.object.userData.palm; openSheet('🌴 نخلة ' + AR(n), `<div class="card"><div class="un" style="direction:rtl">${esc(u)}</div><div class="meta">نخلة في حديقة الذكر 🌴 — اكتب «أستغفر الله» في كومنت وازرع نخلتك</div></div><div class="row"><button class="btn p" id="ga">شوف الحديقة كلها</button></div>`); $('ga').onclick = showGarden; return; }
  if (hit.object.userData.street !== undefined) {
    const i = hit.object.userData.street, who = S.owned['street'+i];
    openSheet('🪧 شارع رقم ' + AR(i+1), who ? `<div class="card">الشارع ده اتسمّى باسم <b style="direction:ltr">@${esc(who)}</b></div>` :
      `<div class="card"><div class="meta">الشارع ده لسه من غير اسم.</div><div class="free" style="margin-top:10px">أعلى ٥ في النقط بيتسمّى الشارع باسمهم 🔥 (١٥ نقطة على الأقل).</div><div class="row"><button class="btn p" id="gs">شوف الترقيات</button></div></div>`);
    if (!who) $('gs').onclick = () => openShop('street');
    return;
  }
  const k = towers.findIndex(t => t.body === hit.object);
  const n = k*100 + Math.min(towers[k].top, Math.max(1, Math.floor(hit.point.y / FH) + 1));
  shopFloor = MAP.has(n) ? n : shopFloor; focusFloor(n);
});

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (fly) {
    const u = Math.min(1, (performance.now() - fly.t0) / fly.dur), e = ease(u);
    ctl.target.lerpVectors(fly.fT, fly.tT, e); cam.position.lerpVectors(fly.fP, fly.tP, e);
    if (u >= 1) fly = null;
  } else if (touring) {
    tourT += dt * .12; const r = 420 + Math.sin(tourT*.7)*120;
    ctl.target.lerp(new THREE.Vector3(Math.sin(tourT*.5)*120, 110, 0), .02);
    cam.position.lerp(new THREE.Vector3(Math.cos(tourT)*r, 160 + Math.sin(tourT*1.3)*90, Math.sin(tourT)*r), .02);
  }
  ctl.update();
  cars.forEach(c => { const d = c.userData; d.x += d.dir*d.s*dt; if (d.x > 360) d.x = -360; if (d.x < -360) d.x = 360; c.position.set(d.x, 0, d.lane); c.rotation.y = d.dir > 0 ? 0 : Math.PI; });
  towers.forEach(tw => { if (tw && tw.grp.userData.crane) tw.grp.userData.crane.rotation.y = Math.sin(t*.3 + tw.grp.position.x)*.5; });
  if (hl.visible) hl.material.opacity = .55 + Math.sin(t*5)*.35;
  R.render(scene, cam); requestAnimationFrame(loop);
}

/* ---------- start ---------- */
Promise.all([document.fonts.load('900 30px Cairo, Arial, sans-serif','٠١٢ab'),document.fonts.load('700 28px Cairo, Arial, sans-serif','abcXYZ_.12 عربي'),document.fonts.load('700 22px Cairo, Arial, sans-serif','AB')]).catch(() => {}).finally(() => {
  rebuild(); tickNight(); loop();
  $('bGarden').onclick = () => { touring = false; flyGarden(); showGarden(); };
  $('bStad').onclick = () => { touring = false; flyStadium(); showStadium(); };
  $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 500);
  const m = location.hash.match(/^#floor-(\d+)$/);
  if (m && MAP.has(+m[1])) { shopFloor = +m[1]; setTimeout(() => focusFloor(+m[1]), 400); }
  else flyTo(new THREE.Vector3(TX(1.5), 120, 0), new THREE.Vector3(TX(1.5) - 120, 240, 560), 2.4);
});
addEventListener('hashchange', () => { const m = location.hash.match(/^#floor-(\d+)$/); if (m && MAP.has(+m[1])) { shopFloor = +m[1]; focusFloor(+m[1]); } });
</script>
